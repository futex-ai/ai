[workspace]
members = [
    "crates/ai-interface",
    "crates/ai-mcp",
    "crates/ai-mcp-oauth",
    "crates/ai-models-anthropic",
    "crates/ai-models-core",
    "crates/ai-models-deepseek",
    "crates/ai-models-google",
    "crates/ai-models-kimi",
    "crates/ai-models-minimax",
    "crates/ai-models-multi",
    "crates/ai-models-openai",
    "crates/ai-models-qwen",
    "crates/ai-models-xai",
    "crates/ai-tool-calling",
    "crates/json-http",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"
authors = ["Futex"]

[workspace.dependencies]
ai-interface = { version = "0.3.0", path = "crates/ai-interface" }
ai-mcp = { version = "0.3.0", path = "crates/ai-mcp" }
ai-mcp-oauth = { version = "0.3.0", path = "crates/ai-mcp-oauth" }
ai-models-anthropic = { version = "0.3.0", path = "crates/ai-models-anthropic" }
ai-models-core = { version = "0.3.0", path = "crates/ai-models-core" }
ai-models-deepseek = { version = "0.3.0", path = "crates/ai-models-deepseek" }
ai-models-google = { version = "0.3.0", path = "crates/ai-models-google" }
ai-models-kimi = { version = "0.3.0", path = "crates/ai-models-kimi" }
ai-models-minimax = { version = "0.3.0", path = "crates/ai-models-minimax" }
ai-models-multi = { version = "0.3.0", path = "crates/ai-models-multi" }
ai-models-openai = { version = "0.3.0", path = "crates/ai-models-openai" }
ai-models-qwen = { version = "0.3.0", path = "crates/ai-models-qwen" }
ai-models-xai = { version = "0.3.0", path = "crates/ai-models-xai" }
ai-tool-calling = { version = "0.3.0", path = "crates/ai-tool-calling" }
internal-error = { version = "0.1.0", git = "https://github.com/futex-ai/internal-error.git", rev = "6477922a1c4db8c3e35189af69f0147464004b99", package = "internal-error" }
json-http = { version = "0.3.0", path = "crates/json-http" }
