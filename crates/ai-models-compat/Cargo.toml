[package]
name = "ai-models-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ai-interface.workspace = true
ai-models-core.workspace = true
async-trait = "0.1.92"
json-http.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
ai-models-core = { workspace = true, features = ["test-support"] }
json-http = { workspace = true, features = ["test-support"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
unimock = "0.6.8"
