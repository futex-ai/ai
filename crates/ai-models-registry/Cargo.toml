[package]
name = "ai-models-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["anthropic", "deepseek", "google", "kimi", "minimax", "openai", "qwen", "typesafe", "xai"]
anthropic = ["dep:ai-models-anthropic"]
deepseek = ["dep:ai-models-compat"]
google = ["dep:ai-models-google"]
kimi = ["dep:ai-models-compat"]
minimax = ["dep:ai-models-compat"]
openai = ["dep:ai-models-openai"]
qwen = ["dep:ai-models-compat"]
typesafe = ["dep:ai-models-typesafe"]
xai = ["dep:ai-models-compat"]

[dependencies]
ai-interface.workspace = true
ai-models-core.workspace = true
ai-models-anthropic = { workspace = true, optional = true }
ai-models-compat = { workspace = true, optional = true }
ai-models-google = { workspace = true, optional = true }
ai-models-openai = { workspace = true, optional = true }
ai-models-typesafe = { workspace = true, optional = true }
json-http.workspace = true
thiserror = "2.0.21"

[dev-dependencies]
ai-models-core = { workspace = true, features = ["test-support"] }
json-http = { workspace = true, features = ["test-support"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
unimock = "0.6.8"
