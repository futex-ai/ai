[package]
name = "json-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[test]]
name = "sse_transport"
path = "tests/sse_transport/mod.rs"

[features]
test-support = ["dep:unimock"]

[dependencies]
async-trait = "0.1.89"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["time"] }
unimock = { version = "0.6.8", optional = true }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
unimock = "0.6.8"
