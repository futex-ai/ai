[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[test]]
name = "live_images"
path = "tests/live_images/mod.rs"

[[test]]
name = "live_judgments"
path = "tests/live_judgments/mod.rs"

[dependencies]
ai-models-registry = { workspace = true }
ai-models-compat = { workspace = true }
ai-testkit = { workspace = true }
ai-interface = { workspace = true, features = ["test-support"] }
ai-mcp.workspace = true
ai-mcp-oauth.workspace = true
ai-models-anthropic.workspace = true
ai-models-google.workspace = true
ai-models-openai.workspace = true
ai-models-typesafe.workspace = true
ai-tool-calling.workspace = true
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
json-http = { workspace = true, features = ["test-support"] }
secrecy = "0.10.3"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
ai-testkit = { workspace = true, features = ["test-support"] }
ai-interface = { workspace = true, features = ["test-support"] }
ai-models-core.workspace = true
ai-models-policy = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
unimock = "0.6.8"
