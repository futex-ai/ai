[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[test]]
name = "live_images"
path = "tests/live_images/mod.rs"

[[test]]
name = "live_videos"
path = "tests/live_videos/mod.rs"

[dependencies]
ai-interface.workspace = true
ai-mcp.workspace = true
ai-mcp-oauth.workspace = true
ai-models-anthropic.workspace = true
ai-models-deepseek.workspace = true
ai-models-google.workspace = true
ai-models-kimi.workspace = true
ai-models-minimax.workspace = true
ai-models-openai.workspace = true
ai-models-qwen.workspace = true
ai-models-xai.workspace = true
ai-tool-calling.workspace = true
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
json-http.workspace = true
secrecy = "0.10.3"
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
ai-interface = { workspace = true, features = ["test-support"] }
ai-models-core.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
unimock = "0.6.8"
